<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScaleBench</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eef7;background:#080b12}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#172033 0,#080b12 42%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:30px}.brand{font-size:28px;font-weight:800;letter-spacing:-.04em}.sub{color:#8793a8;margin-top:5px}.badge{border:1px solid #29402f;background:#0d1a12;color:#7ee2a0;border-radius:999px;padding:8px 13px;font-size:13px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#10151f;border:1px solid #202938;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0005}.wide{grid-column:1/-1}.label{font-size:12px;color:#8793a8;text-transform:uppercase;letter-spacing:.1em}.value{font-size:34px;font-weight:800;margin-top:7px}.arch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}.node{padding:12px 14px;border-radius:12px;background:#171e2b;border:1px solid #2a3446}.arrow{color:#66748a}input{width:100%;margin-top:9px;background:#0a0f17;border:1px solid #293447;color:#fff;border-radius:10px;padding:12px}button{margin-top:14px;width:100%;padding:13px;border:0;border-radius:10px;background:#f1f5f9;color:#0b1018;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.result{margin-top:15px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0b1018;border:1px solid #202938;border-radius:12px;padding:13px}.metric b{display:block;font-size:20px;margin-top:4px}.log{margin-top:15px;color:#9ba8ba;font:13px ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap}.links{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.links a{color:#9bc1ff;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.result{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">ScaleBench</div><div class="sub">Distributed systems scalability laboratory</div></div><div id="badge" class="badge">Checking service...</div></div>
  <div class="grid">
    <section class="card">
      <div class="label">Architecture</div>
      <div class="arch"><div class="node">Client</div><div class="arrow">→</div><div class="node">API</div><div class="arrow">→</div><div class="node">Worker Pool</div><div class="arrow">→</div><div class="node">Storage</div></div>
      <div class="result"><div class="metric"><span class="label">Workers</span><b id="workers">—</b></div><div class="metric"><span class="label">Status</span><b id="status">—</b></div><div class="metric"><span class="label">API</span><b>FastAPI</b></div></div>
    </section>
    <section class="card">
      <div class="label">Benchmark</div>
      <label>Number of events<input id="count" type="number" min="1" max="10000" value="1000"></label>
      <button id="run">Run scalability benchmark</button>
      <div id="output" class="log">Ready.</div>
    </section>
    <section class="card wide">
      <div class="label">Latest result</div>
      <div class="result"><div class="metric"><span class="label">Events</span><b id="events">—</b></div><div class="metric"><span class="label">Throughput</span><b id="throughput">—</b></div><div class="metric"><span class="label">Latency</span><b id="latency">—</b></div></div>
      <div class="links"><a href="/docs">API documentation</a><a href="/health">Health endpoint</a><a href="/metrics">Prometheus metrics</a></div>
    </section>
  </div>
</div>
<script>
async function refresh(){try{const r=await fetch('/api/status');const d=await r.json();document.querySelector('#badge').textContent='● '+d.status;document.querySelector('#workers').textContent=d.workers;document.querySelector('#status').textContent=d.status}else{throw 0}}catch(e){document.querySelector('#badge').textContent='Service unavailable';document.querySelector('#status').textContent='offline'}}
async function run(){const btn=document.querySelector('#run');const out=document.querySelector('#output');const n=Number(document.querySelector('#count').value);btn.disabled=true;out.textContent='Processing '+n.toLocaleString()+' events...';const events=Array.from({length:n},(_,i)=>({device_id:'device-'+(i%50),value:(i%1000)/10,timestamp:Date.now()/1000}));try{const t=performance.now();const r=await fetch('/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');const ms=performance.now()-t;document.querySelector('#events').textContent=d.events.toLocaleString();document.querySelector('#throughput').textContent=d.throughput_events_per_second.toLocaleString()+' ev/s';document.querySelector('#latency').textContent=ms.toFixed(1)+' ms';out.textContent=JSON.stringify(d,null,2)}catch(e){out.textContent='Error: '+e.message}finally{btn.disabled=false}}
document.querySelector('#run').addEventListener('click',run);refresh();setInterval(refresh,10000);
</script>
</body>
</html>
